# Qwen Image 2.1 图片编辑（参考图 → 编码器 latent → KSampler，25 步）
#
# 没有 width/height 绑定，但绑了 resolution：编辑的输出比例跟随参考图，
# resolution 决定像素量级（节点内部按 sqrt(resolution² × 比例) 取整到 32 倍数）。
output_node: "9"

reference_image:
  loader_node: "1"
  loader_input: image
  encoder_node: "6"
  encoder_input: images.image_1

bindings:
  prompt: { node: "6", input: prompt }
  negative_prompt: { node: "6", input: negative_prompt }
  resolution: { node: "6", input: resolution }
  seed: { node: "7", input: seed }
  steps: { node: "7", input: steps }
  cfg: { node: "7", input: cfg }
  sampler: { node: "7", input: sampler_name }
  scheduler: { node: "7", input: scheduler }
  denoise: { node: "7", input: denoise }
  filename_prefix: { node: "9", input: filename_prefix }
