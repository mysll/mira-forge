# MiniMax H3 文生视频（fl2va + turbo LoRA）
#
# 节点 id 与 workflows/minimax_h3_t2v.json 对应；换工作流只改这个文件。
# 时长不直接暴露：Worker 把「秒」换算成 MiniMax 要求的帧数（5 + 17k），
# 写入 length。fps 只影响 CreateVideo 的封装与播放速度。

output_node: "15"          # SaveVideo
poster_node: "17"          # SaveImage（第 0 帧，用作缩略图）

bindings:
  prompt:
    node: "6"
    input: prompt
  width:
    node: "6"
    input: width
  height:
    node: "6"
    input: height
  length:
    node: "6"
    input: length
  fps:
    node: "14"
    input: fps
  seed:
    node: "10"
    input: noise_seed
  steps:
    node: "8"
    input: steps
  scheduler:
    node: "8"
    input: scheduler
  sampler:
    node: "9"
    input: sampler_name
  filename_prefix:
    node: "15"
    input: filename_prefix
  poster_prefix:
    node: "17"
    input: filename_prefix
