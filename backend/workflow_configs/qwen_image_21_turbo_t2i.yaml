# Qwen Image 2.1 Turbo 文生图（SamplerCustomAdvanced + 固定 8 步 sigma 表）
#
# 没有 steps 绑定：步数由 ManualSigmas 的 sigma 表决定，传 steps 也不会生效。
output_node: "13"

bindings:
  prompt: { node: "5", input: prompt }
  negative_prompt: { node: "5", input: negative_prompt }
  width: { node: "6", input: width }
  height: { node: "6", input: height }
  seed: { node: "7", input: noise_seed }
  cfg: { node: "8", input: cfg }
  sampler: { node: "9", input: sampler_name }
  filename_prefix: { node: "13", input: filename_prefix }
