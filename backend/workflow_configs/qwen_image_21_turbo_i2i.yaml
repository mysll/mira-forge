output_node: "13"

reference_image:
  encoder_node: "5"
  encoder_input: images.image_1
  loaders:
    - { node: "20", input: image }
    - { node: "21", input: image }

bindings:
  prompt: { node: "5", input: prompt }
  negative_prompt: { node: "5", input: negative_prompt }
