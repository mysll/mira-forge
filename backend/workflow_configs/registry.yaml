# MiraForge 模型 / 工作流注册表
#
# 这是「模型可选」的唯一数据源：新增模型或新增工作流只改这个文件，不改业务代码。
# json / config 路径相对 backend/ 目录。
# validated: 该工作流是否在真实 ComfyUI 上执行验证过（false = 待验证，P2 会逐个跑通）。
# 文件是否存在由程序自动探测，无需手工维护 available 字段。

version: 1

models:
  - id: qwen_image_21
    label: Qwen Image 2.1
    description: 标准质量，25 步采样，官方 2.1 模板参数
    # 有负面提示词且用户没有显式指定 CFG 时，用它替换默认的 1.0。
    # 原因：ComfyUI 在 cfg≈1 时会走 cfg1 优化，直接跳过 uncond 分支（comfy/samplers.py:610），
    # 负面提示词因此完全不生效。
    negative_prompt_cfg: 3.0
    defaults:
      steps: 25
      cfg: 1.0
      sampler: euler
      scheduler: simple
      denoise: 1.0
      width: 1024
      height: 1024
    capabilities:
      exposes_steps: true
      exposes_cfg: true
      exposes_sampler: true
    workflows:
      - type: text_to_image
        label: 文生图
        json: workflows/qwen_image_21_t2i.json
        config: workflow_configs/qwen_image_21_t2i.yaml
        validated: true
      - type: image_edit
        label: 图片编辑
        json: workflows/qwen_image_21_edit.json
        config: workflow_configs/qwen_image_21_edit.yaml
        validated: true
      - type: image_to_image
        label: 图生图
        json: workflows/qwen_image_21_i2i.json
        config: workflow_configs/qwen_image_21_i2i.yaml
        validated: true

  - id: qwen_image_21_turbo
    label: Qwen Image 2.1 Turbo
    description: 8 步蒸馏版，速度优先；步数由固定 sigma 表决定，CFG 可调（>1 时负面提示词才生效）
    default: true
    # 蒸馏模型的 CFG 弹性较差，用 2.0 而不是 3.0；再高会开始过饱和。
    negative_prompt_cfg: 2.0
    defaults:
      steps: 8
      cfg: 1.0
      sampler: euler
      denoise: 1.0
      width: 1024
      height: 1024
    capabilities:
      exposes_steps: false
      # CFG 落在 CFGGuider.cfg 上，是独立可调的：>1 才走 uncond 分支，负面提示词才会生效
      exposes_cfg: true
      exposes_sampler: false
    workflows:
      - type: text_to_image
        label: 文生图
        json: workflows/qwen_image_21_turbo_t2i.json
        config: workflow_configs/qwen_image_21_turbo_t2i.yaml
        validated: true
      - type: image_edit
        label: 图片编辑
        json: workflows/qwen_image_21_turbo_edit.json
        config: workflow_configs/qwen_image_21_turbo_edit.yaml
        validated: false
      - type: image_to_image
        label: 图生图
        json: workflows/qwen_image_21_turbo_i2i.json
        config: workflow_configs/qwen_image_21_turbo_i2i.yaml
        validated: true

  # ---- 其它图片模型 ----
  - id: z_image_turbo
    label: Z-Image Turbo
    description: Lumina2 架构的 8 步蒸馏模型，1024 原生；负面提示词被 ConditioningZeroOut 零化，不可用
    defaults:
      steps: 8
      cfg: 1.0
      sampler: res_multistep
      scheduler: simple
      denoise: 1.0
      width: 1024
      height: 1024
    capabilities:
      exposes_steps: false
      exposes_cfg: false
      exposes_sampler: true
      exposes_negative_prompt: false
    workflows:
      - type: text_to_image
        label: 文生图
        json: workflows/z_image_turbo_t2i.json
        config: workflow_configs/z_image_turbo_t2i.yaml
        validated: true

  - id: flux2_klein_distilled
    label: FLUX.2 Klein 4B Distilled
    description: 4 步蒸馏版，最快；cfg 固定 1.0，负面提示词无效
    defaults:
      steps: 4
      cfg: 1.0
      sampler: euler
      denoise: 1.0
      width: 1024
      height: 1024
    capabilities:
      exposes_steps: false
      exposes_cfg: false
      exposes_sampler: false
      exposes_negative_prompt: false
    workflows:
      - type: text_to_image
        label: 文生图
        json: workflows/flux2_klein_distilled_t2i.json
        config: workflow_configs/flux2_klein_distilled_t2i.yaml
        validated: true

  - id: flux2_klein_base
    label: FLUX.2 Klein 4B Base
    description: 20 步基础版，质量优先，支持负面提示词；比蒸馏版慢约五倍
    defaults:
      steps: 20
      cfg: 5.0
      sampler: euler
      denoise: 1.0
      width: 1024
      height: 1024
    capabilities:
      exposes_steps: true
      exposes_cfg: true
      exposes_sampler: false
      exposes_negative_prompt: true
    workflows:
      - type: text_to_image
        label: 文生图
        json: workflows/flux2_klein_base_t2i.json
        config: workflow_configs/flux2_klein_base_t2i.yaml
        validated: true

  # ---- 视频（二期）----
  - id: minimax_h3
    label: MiniMax H3
    description: 音视频同出，1–15 秒 / 24fps；8 步 turbo LoRA，5 秒约 1 分钟
    defaults:
      # 时长用秒表达，Worker 再换算成 MiniMax 要求的帧数（5 + 17k）
      duration_seconds: 5
      fps: 24
      steps: 6
      scheduler: simple
      sampler: res_multistep
      width: 864
      height: 480
    capabilities:
      media: video
      exposes_steps: false
      exposes_cfg: false
      exposes_sampler: false
      exposes_negative_prompt: false
      exposes_duration: true
      # 时长：3/5/8/10 是前端快捷档，1–15 秒可用滑块自由取；
      # 帧数 = max(5, round(秒×24)) 再补齐到 5 + 17k（模型 length 的 step 是 17）
      durations: [3, 5, 8, 10]
      duration_min: 1
      duration_max: 15
      # 一次最多 4 条，默认 1 条：串行出，4 条 × 5 秒大约 4–8 分钟
      max_count: 4
      count_options: [1, 2, 3, 4]
      # 前端按「比例 × 分辨率档（480/720/1080）」自己算宽高（32 对齐），这里列常用档位给接口做参考
      resolutions:
        - { width: 864, height: 480, label: "16:9 480p" }
        - { width: 1280, height: 736, label: "16:9 720p" }
        - { width: 1920, height: 1088, label: "16:9 1080p" }
        - { width: 480, height: 864, label: "9:16 480p" }
        - { width: 736, height: 1280, label: "9:16 720p" }
        - { width: 1088, height: 1920, label: "9:16 1080p" }
    workflows:
      - type: text_to_video
        label: 文生视频
        json: workflows/minimax_h3_t2v.json
        config: workflow_configs/minimax_h3_t2v.yaml
        validated: false
      - type: image_to_video
        label: 图生视频
        json: workflows/minimax_h3_i2v.json
        config: workflow_configs/minimax_h3_i2v.yaml
        validated: false
